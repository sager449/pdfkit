<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e53935">
  <title>PDFKit — Offline</title>

  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f5f5;
      color: #111;
      padding: 24px;
      text-align: center;
    }

    main {
      width: min(100%, 460px);
    }

    .icon {
      width: 112px;
      height: 112px;
      margin: 0 auto 28px;
      border-radius: 24px;
      background: #e53935;
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 28px;
      letter-spacing: -1px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 7vw, 40px);
    }

    p {
      margin: 0 auto 28px;
      color: #444;
      line-height: 1.6;
      font-size: 17px;
    }

    .ar {
      display: block;
      margin-top: 6px;
      direction: rtl;
      font-size: 15px;
      color: #666;
    }

    a {
      display: inline-block;
      padding: 13px 28px;
      border-radius: 8px;
      background: #e53935;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      transition: background 0.2s ease;
    }

    a:hover,
    a:focus-visible {
      background: #c62828;
    }
  </style>
</head>

<body>
  <main>
    <div class="icon" aria-label="PDFKit logo">
      PDF<br>
      <small>kit</small>
    </div>

    <h1>You’re offline</h1>

    <p>
      Check your internet connection and try again.
      <span class="ar">
        تحقق من اتصالك بالإنترنت ثم حاول مرة أخرى.
      </span>
    </p>

    <a href="/">Go home</a>
  </main>
</body>
</html>
