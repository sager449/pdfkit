<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Studio — PDFKit Studio</title>
    <meta name="description" content="Edit your PDF project — add text, images, highlights, and drawings." />
    <link rel="canonical" href="https://pdfkit-xi.vercel.app/studio.html" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@400;500;600;700;800;900&family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/studio.css" />
  </head>
  <body class="studio-body">
    <header class="studio-header">
      <div class="header-left">
        <a class="icon-btn" href="index.html" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </a>
        <input type="text" class="project-title-input" id="project-title" value="Untitled" />
      </div>

      <div class="header-center">
        <button class="icon-btn" id="undo-btn" aria-label="Undo" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 14 4 9 9 4"></polyline>
            <path d="M20 20v-7a4 4 0 0 0-4-4H4"></path>
          </svg>
        </button>
        <button class="icon-btn" id="redo-btn" aria-label="Redo" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 14 20 9 15 4"></polyline>
            <path d="M4 20v-7a4 4 0 0 1 4-4h12"></path>
          </svg>
        </button>
      </div>

      <div class="header-right">
        <button class="icon-btn" id="export-btn" aria-label="Export">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </button>
        <button class="btn-save" id="save-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          Save
        </button>
      </div>
    </header>
    <main class="studio-main">
  <div class="canvas-wrapper" id="canvas-wrapper">
    <div class="canvas-stage" id="canvas-stage"></div>
  </div>
</main>

<nav class="studio-toolbar" id="studio-toolbar">
  <button class="tool-btn" data-tool="text" aria-label="Text">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="4 7 4 4 20 4 20 7"></polyline>
      <line x1="9" y1="20" x2="15" y2="20"></line>
      <line x1="12" y1="4" x2="12" y2="20"></line>
    </svg>
    <span>Text</span>
  </button>

  <button class="tool-btn" data-tool="highlight" aria-label="Highlight">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 11l-6 6v3h3l6-6"></path>
      <path d="M14 7l3 3"></path>
      <path d="M17 4l3 3-9 9-3-3z"></path>
    </svg>
    <span>Highlight</span>
  </button>

  <button class="tool-btn" data-tool="draw" aria-label="Draw">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
      <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
      <path d="M2 2l7.586 7.586"></path>
      <circle cx="11" cy="11" r="2"></circle>
    </svg>
    <span>Draw</span>
  </button>

  <button class="tool-btn" data-tool="image" aria-label="Image">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2"></rect>
      <circle cx="8.5" cy="8.5" r="1.5"></circle>
      <polyline points="21 15 16 10 5 21"></polyline>
    </svg>
    <span>Image</span>
  </button>

  <button class="tool-btn" data-tool="shape" aria-label="Shape">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2"></rect>
    </svg>
    <span>Shape</span>
  </button>

  <button class="tool-btn" data-tool="eraser" aria-label="Eraser">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 20H7L3 16a1 1 0 0 1 0-1.4L14.6 3a1 1 0 0 1 1.4 0L21 8a1 1 0 0 1 0 1.4L10.4 20"></path>
      <line x1="18" y1="13" x2="6" y2="13"></line>
    </svg>
    <span>Eraser</span>
  </button>
      </nav>
          <div class="tool-panel" id="tool-panel" hidden>
      <button class="panel-close" id="panel-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div class="panel-content" id="panel-content"></div>
    </div>

    <input type="file" id="image-upload" accept="image/*" hidden />

    <script src="js/db.js"></script>
    <script src="js/studio.js"></script>
  </body>
</html>
