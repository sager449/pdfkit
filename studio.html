<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5">
  <title>الاستوديو — PDFKit Studio</title>
  <meta name="description" content="محرر PDF تفاعلي يعمل بالكامل في المتصفح">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/studio.css">
</head>
<body class="studio-body">
  <header class="studio-header" aria-label="رأس الاستوديو">
    <div class="header-group header-start">
      <a class="icon-btn" href="index.html" data-i18n-aria="back" aria-label="رجوع">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </a>
      <input id="project-title" class="project-title-input" value="مشروع بدون عنوان" autocomplete="off" aria-label="اسم المشروع">
    </div>
    <div class="header-group header-history" aria-label="سجل التعديلات">
      <button class="icon-btn" id="undo-btn" type="button" data-i18n-aria="undo" aria-label="تراجع" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 6 6v5"/></svg>
      </button>
      <button class="icon-btn" id="redo-btn" type="button" data-i18n-aria="redo" aria-label="إعادة" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5m5 5H10a6 6 0 0 0-6 6v5"/></svg>
      </button>
    </div>
    <div class="header-group header-end">
      <button class="icon-btn" id="language-btn" type="button" aria-label="English">EN</button>
      <button class="icon-btn" id="export-btn" type="button" data-i18n-aria="export" aria-label="تصدير">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 5-5m-5 5-5-5M5 21h14a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2"/></svg>
      </button>
      <button class="btn-save" id="save-btn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11zM7 3v5h8M8 21v-6h8v6"/></svg>
        <span data-i18n="save">حفظ</span>
      </button>
    </div>
  </header>

  <main class="studio-main" id="studio-main">
    <div class="canvas-wrapper" id="canvas-wrapper">
      <div class="canvas-stage" id="canvas-stage" aria-live="polite"></div>
    </div>
  </main>

  <nav class="studio-toolbar" id="studio-toolbar" aria-label="أدوات التحرير">
    <button class="tool-btn" type="button" data-tool="text"><span class="tool-icon">T</span><span data-i18n="text">نص</span></button>
    <button class="tool-btn" type="button" data-tool="highlight"><span class="tool-icon">▰</span><span data-i18n="highlight">تمييز</span></button>
    <button class="tool-btn" type="button" data-tool="draw"><span class="tool-icon">✎</span><span data-i18n="draw">رسم</span></button>
    <button class="tool-btn" type="button" data-tool="image"><span class="tool-icon">▧</span><span data-i18n="image">صورة</span></button>
    <button class="tool-btn" type="button" data-tool="shape"><span class="tool-icon">□</span><span data-i18n="shape">شكل</span></button>
    <button class="tool-btn" type="button" data-tool="eraser"><span class="tool-icon">⌫</span><span data-i18n="eraser">ممحاة</span></button>
  </nav>

  <section class="tool-panel" id="tool-panel" hidden aria-label="خيارات الأداة">
    <div class="sheet-grip" aria-hidden="true"></div>
    <button class="panel-close" id="panel-close" type="button" aria-label="إغلاق">×</button>
    <div class="panel-content" id="panel-content"></div>
  </section>

  <input type="file" id="image-upload" accept="image/*" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/db.js"></script>
  <script src="js/studio.js"></script>
</body>
</html>
